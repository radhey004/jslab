<!DOCTYPE html>
<html>
<head>
    <title>Array Operations</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }

        .box {
            background: white;
            width: 650px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }

        .section {
            border: 1px solid #aaa;
            margin: 20px 0;
            padding: 15px;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            background: black;
            color: white;
            border: none;
            border-radius: 5px;
        }

        p {
            font-size: 17px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Array Operations</h2>

    <!-- Standard methods -->
    <div class="section">

        <h2>Using Standard Array Methods</h2>

        <input id="len1" type="number" placeholder="Array length">
        <button onclick="generate1()">Generate</button>

        <p id="arr1"></p>

        <input id="remove1" type="number" placeholder="Element to remove">
        <button onclick="remove1()">Remove</button>

        <br>

        <input id="search1" type="number" placeholder="Element to search">
        <button onclick="search1()">Search</button>

        <br>

        <button onclick="empty1()">Empty Array</button>

        <p id="out1"></p>

    </div>


    <!-- Without standard methods -->
    <div class="section">

        <h2>Without Standard Array Methods</h2>

        <input id="len2" type="number" placeholder="Array length">
        <button onclick="generate2()">Generate</button>

        <p id="arr2"></p>

        <input id="remove2" type="number" placeholder="Element to remove">
        <button onclick="remove2()">Remove</button>

        <br>

        <input id="search2" type="number" placeholder="Element to search">
        <button onclick="search2()">Search</button>

        <br>

        <button onclick="empty2()">Empty Array</button>

        <p id="out2"></p>

    </div>

</div>


<script>

let a1 = [];
let a2 = [];

// Generate using push()
function generate1() {

    let n = parseInt(document.getElementById("len1").value);
    a1 = [];

    for (let i = 0; i < n; i++) {
        a1.push(Math.floor(Math.random() * 100) + 1);
    }

    document.getElementById("arr1").innerHTML =
        "Array = [" + a1.join(", ") + "]";
}

// Remove using splice()
function remove1() {

    let value = parseInt(document.getElementById("remove1").value);
    let index = a1.indexOf(value);

    if (index != -1) {
        a1.splice(index, 1);
        document.getElementById("out1").innerHTML =
            "Element removed";
    } else {
        document.getElementById("out1").innerHTML =
            "Element not found";
    }

    document.getElementById("arr1").innerHTML =
        "Array = [" + a1.join(", ") + "]";
}

// Search using includes()
function search1() {

    let value = parseInt(document.getElementById("search1").value);

    if (a1.includes(value))
        document.getElementById("out1").innerHTML = "Element Found";
    else
        document.getElementById("out1").innerHTML = "Element Not Found";
}

// Empty using length
function empty1() {

    a1.length = 0;

    document.getElementById("arr1").innerHTML =
        "Array = []";

    document.getElementById("out1").innerHTML =
        "Array is empty";
}


// Generate without push()
function generate2() {

    let n = parseInt(document.getElementById("len2").value);
    a2 = [];

    for (let i = 0; i < n; i++) {
        a2[i] = Math.floor(Math.random() * 100) + 1;
    }

    show2();
}

// Remove without splice()
function remove2() {

    let value = parseInt(document.getElementById("remove2").value);
    let index = -1;

    for (let i = 0; i < a2.length; i++) {
        if (a2[i] === value) {
            index = i;
            break;
        }
    }

    if (index != -1) {

        for (let i = index; i < a2.length - 1; i++) {
            a2[i] = a2[i + 1];
        }

        a2.length = a2.length - 1;

        document.getElementById("out2").innerHTML =
            "Element removed";

    } else {

        document.getElementById("out2").innerHTML =
            "Element not found";
    }

    show2();
}

// Search without includes()
function search2() {

    let value = parseInt(document.getElementById("search2").value);
    let found = false;

    for (let i = 0; i < a2.length; i++) {

        if (a2[i] === value) {
            found = true;
            break;
        }
    }

    if (found)
        document.getElementById("out2").innerHTML = "Element Found";
    else
        document.getElementById("out2").innerHTML = "Element Not Found";
}

// Empty without array method
function empty2() {

    a2 = [];

    document.getElementById("arr2").innerHTML =
        "Array = []";

    document.getElementById("out2").innerHTML =
        "Array is empty";
}

// Display second array
function show2() {

    let result = "";

    for (let i = 0; i < a2.length; i++) {

        result = result + a2[i];

        if (i < a2.length - 1)
            result = result + ", ";
    }

    document.getElementById("arr2").innerHTML =
        "Array = [" + result + "]";
}

</script>

</body>
</html>
